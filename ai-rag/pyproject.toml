[project]
name = "ai-rag"
version = "0.1.0"
description = "AI RAG 知识库微服务 - 基于 RAGLite 的向量检索服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # RAG 核心 - RAGLite
    "raglite>=0.7.0",
    # 支持 PDF/Word 等多格式文档解析
    "raglite[pandoc]",
    # 数据验证
    "pydantic>=2.10.3",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.2.1",
    # HTTP 客户端
    "httpx>=0.27.0",
    # 文件上传处理
    "python-multipart>=0.0.9",
    # PostgreSQL 驱动 (RAGLite 用 pgvector)
    "psycopg[binary]>=3.2.1",
    "asyncpg>=0.29.0",
    # LiteLLM (RAGLite 底层 LLM 抽象)
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
